<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Journeyman</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Game Title -->
<header class="game-title">
  <h1>The Journeyman</h1>
</header>

<div class="game-container">

  <!-- Main Card -->
  <div class="career-section">
    <h2 class="card-title">Career Path</h2>
    <div class="career-main">
      <!-- Career Grid -->
      <div class="career-grid-container">
        <div class="career-grid-header">
          <div class="career-col-title">Club</div>
          <div class="career-col-title">Dates</div>
          <div class="career-col-title">Apps / Goals</div>
        </div>
        <div class="career-grid" id="careerGrid"></div>
      </div>

      <!-- International Info Card -->
      <div id="intCard">
        <h3 class="card-title">International Stats</h3>
        <div data-field="nationality"><span class="value">████</span></div>
        <div data-field="intl"><span class="value">████</span></div>
        <div data-field="capsDates"><span class="value">████</span></div>
      </div>
    </div>

    <!-- User Input and Buttons -->
    <div class="input-actions">
      <input type="text" id="guessInput" placeholder="Enter player guess">
      <button id="submitBtn">Submit</button>
      <button id="revealBtn">Reveal</button>
      <button id="skipBtn">Skip</button>
    </div>

    <!-- Result Text -->
    <div id="result">—</div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section" id="totalScoreSection">
      <h3>Total Score</h3>
      <div id="totalScore">0</div>
    </div>
    <div class="sidebar-section" id="historySection">
      <h3>Previous Round</h3>
      <div id="history"></div>
    </div>
    <div class="sidebar-section" id="guessLogSection">
      <h3>Current Round Guesses</h3>
      <div id="guessLog"></div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
